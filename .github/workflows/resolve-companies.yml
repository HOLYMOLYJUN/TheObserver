name: 회사 식별자 수집 (수동)

# 사람인/잡코리아에서 감시 대상 기업을 검색해 회사코드·정확한 표기를 찾아낸다.
# 결과는 아티팩트로 올라가며, 이를 보고 data/companies.json 을 확정한다.
on:
  workflow_dispatch:
    inputs:
      company_id:
        description: "특정 회사만 조회 (companies.json 의 id). 비우면 전체"
        type: string
        required: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium

      - name: Resolve company identifiers
        env:
          COMPANY_ID: ${{ inputs.company_id }}
        run: npm run resolve

      - name: Job summary
        if: always()
        run: cat debug-output/summary.md >> "$GITHUB_STEP_SUMMARY" || echo "요약 생성 실패"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-candidates
          path: debug-output/
          retention-days: 14
