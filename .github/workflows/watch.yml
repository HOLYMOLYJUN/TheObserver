name: 채용공고 감시

on:
  schedule:
    # GitHub Actions cron 은 UTC 기준. KST = UTC+9
    - cron: "0 0 * * *"   # 09:00 KST
    - cron: "0 8 * * *"   # 17:00 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Slack 발송 없이 콘솔 출력만"
        type: boolean
        default: false
      no_dev_filter:
        description: "개발 직무 필터 끄기 (모든 공고 통과)"
        type: boolean
        default: false
      only_company:
        description: "탐색용 — 이 회사 하나만 조회 (예: freegrow). 상태 저장 안 함"
        type: string
        required: false

# 동시 실행 방지 — seen.json 커밋 충돌을 막는다
concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # seen.json 을 커밋해 되돌려보내야 하므로 브랜치를 명시하고 전체 히스토리를 받는다.
      # shallow clone 에서는 이후 pull --rebase 가 실패할 수 있다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 브라우저 폴백용. --only-shell 로 헤드리스 셸만 받아 설치 시간을 줄인다.
      - name: Install Chromium (fallback only)
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run watcher
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SARAMIN_ACCESS_KEY: ${{ secrets.SARAMIN_ACCESS_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          NO_DEV_FILTER: ${{ inputs.no_dev_filter }}
          ONLY_COMPANY: ${{ inputs.only_company }}
        run: npm run watch

      # seen.json 커밋은 중복 알림 방지인 동시에,
      # 60일 무활동으로 스케줄이 꺼지는 걸 막는 안전장치이기도 하다.
      - name: Commit state
        if: always() && inputs.dry_run != true && inputs.only_company == ''
        run: |
          if git diff --quiet -- data/seen.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          git commit -m "chore: update seen postings [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push 실패, ${i}번째 재시도"
            sleep $((2 ** i))
          done
          exit 1
